name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    env:
      # Used only by the aarch64 target; harmless for the others.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cross-compiler
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Test the Mac build
        if: runner.os == 'macOS'
        run: |
          cargo test --target ${{ matrix.target }}
          python3 tools/termtest.py target/${{ matrix.target }}/release/empires
          python3 tools/ptytest.py target/${{ matrix.target }}/release/empires

      - name: Tarball
        run: |
          tag=${{ github.event.inputs.tag || github.ref_name }}
          name=empires-$tag-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/empires "$name"/
          cp README.md CHANGELOG.md CONTRIBUTING.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp -R docs tools "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -l "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes for this tag, from the changelog
        run: |
          tag=${{ github.event.inputs.tag || github.ref_name }}
          # The section for this version, up to the next heading of the same
          # level. Falls back to a pointer at the changelog.
          awk -v v="${tag#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for what changed." > notes.md
          fi
          head -20 notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${{ github.event.inputs.tag || github.ref_name }}
          gh release create "$tag" dist/* \
            --title "empires $tag" \
            --notes-file notes.md \
            --verify-tag
