[package]
name = "empires"
version = "0.3.1"
edition = "2021"
description = "Rise and Fall of Empires — a lo-fi passive world simulator for the terminal"
authors = ["Sam Schlesinger <sgschlesinger@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SamuelSchlesinger/rise-and-fall-of-empires"
readme = "README.md"
keywords = ["simulation", "terminal", "tui", "worldgen", "game"]
categories = ["games", "simulation", "command-line-utilities"]
# See CONTRIBUTING.md ("Minimum supported Rust version"). Nothing in the tree
# needs a library feature newer than `std::sync::OnceLock` (1.70); the binding
# constraint is a type-inference improvement that older compilers lack.
rust-version = "1.70"
exclude = [
    ".claude/",
    ".github/",
    ".editorconfig",
    "docs/screenshot.png",
    "tools/",
]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
